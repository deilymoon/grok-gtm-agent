<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Grok GTM Agent — Recording Frame</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wallpaper{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 20%,#bfdbfe,transparent 55%),radial-gradient(ellipse at 80% 20%,#fbcfe8,transparent 55%),linear-gradient(135deg,#dbeafe,#e0e7ff 45%,#fef3c7)}.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}.window{width:min(1600px,90vw);height:min(940px,88vh);border-radius:18px;overflow:hidden;background:#f7f7f8;box-shadow:0 30px 100px rgba(15,23,42,.2)}.bar{height:40px;background:#f3f4f6;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:8px;padding:0 16px;position:relative}.dot{width:12px;height:12px;border-radius:50%}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}.label{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;color:#6b7280}.content{height:calc(100% - 40px)}iframe{width:100%;height:100%;border:0;background:#f7f7f8}
</style>
</head>
<body>
<div class="wallpaper"></div><div class="stage"><div class="window"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span class="label">Grok GTM Agent</span></div><div class="content"><iframe src="index.html?once=1&startdelay=250" title="Grok GTM Agent showcase"></iframe></div></div></div>
</body>
</html>
